# Redoubt :: CI — o mesmo guarda-corpo do hook pre-push (ruff -> mypy -> suite), so que no
# servidor: nao da para pular com --no-verify e nao depende da maquina de quem empurrou.
# Windows porque o produto e Windows (instalador, DPAPI/ACL, caminhos, CRLF).
name: CI

on:
  push:
    branches: [main, homologacao]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint + tipos + suite (Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = a versao do build/README; 3.14 = a que roda na maquina de desenvolvimento.
        python: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff (lint)
        run: python -m ruff check . --output-format=github

      - name: mypy (tipos nos nucleos puros)
        run: python -m mypy

      - name: Suite (isolada por arquivo, Qt offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: python tools/run_tests.py
